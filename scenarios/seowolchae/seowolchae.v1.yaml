scoring:
  totalScore: 100
  passScore: 70
  evidenceSlots:
    recommendedCount: 3
  deductionFields:
    - code: CULPRIT_SELECTION
      label: "범인 선택"
      points: 30
    - code: EVIDENCE_PROOF_COVERAGE
      label: "증거 Proof Dimension 커버리지"
      points: 20
    - code: METHOD_EXPLANATION
      label: "범행 방법 설명"
      points: 20
    - code: MOTIVE_EXPLANATION
      label: "동기 설명"
      points: 15
    - code: COVERUP_OR_ALIBI_EXPLANATION
      label: "은폐 또는 알리바이 설명"
      points: 10
    - code: REASONING_CONSISTENCY
      label: "논리 일관성"
      points: 5
  proofDimensionPolicy:
    scoringMode: PROOF_DIMENSION_COVERAGE
    dimensions:
      - TIME_PROOF
      - METHOD_PROOF
      - ACCESS_PROOF
      - MOTIVE_PROOF
      - COVERUP_PROOF
      - SUPPORT_PROOF
    primaryEvidenceRule: "해당 proof dimension을 직접 증명하는 핵심 증거로 높은 점수를 부여한다."
    secondaryEvidenceRule: "primary evidence와 함께 선택될 때 dimension을 보강하며, 단독으로는 dimension 만점 처리하지 않는다."
    partialEvidenceRule: "방향은 맞지만 정보가 부족한 증거는 부분 점수만 부여한다."
  scoreCapByMaxUnlockedPhase:
    PHASE_0_OPENING: 45
    PHASE_1_BASIC_OBJECTS: 60
    PHASE_2_SYSTEM_LOGS: 75
    PHASE_3_MOTIVE_AND_CONTRADICTION: 85
    PHASE_4_KILLING_BLOW: 100
  noVitalLogSubmission:
    allowed: true
    maxScoreCap: 85
  wrongAnswerFeedback:
    - selectedCharacterCode: WITNESS_CARE_MANAGER
      maxScore: 35
      feedbackText: |-
        문하연은 바이탈 로그를 숨기고 제보를 망설인 수상한 인물이 맞습니다.
        하지만 그녀가 치명 경로가 된 물병, 약통, 디캔터, 처방 메모 중 어느 하나를 직접 조작했다는 증거는 없습니다.
        그녀가 숨긴 것은 범행이 아니라, 재단 비리를 제보하기 위해 보존해 둔 객관 기록과 그 제출 시점이었습니다.
        진범은 문하연이 숨긴 로그가 가리키는 시간표 안에서, 실제 치명 물건에 접근한 인물입니다.
