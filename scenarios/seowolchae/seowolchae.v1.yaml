  deathLocationCode: LOC_DIRECTOR_SUITE
  discoveredAtText: "회의와 만찬 이후 2층 이사장 침실에서 의식 저하 상태로 발견됨"
  publicCauseOfDeathText: "심장질환 또는 약물 부작용처럼 보이는 급성 쇼크"
  portraitAssetKey: official/seowolchae/v1/victims/VICTIM_CHA_MINHYUK.png

